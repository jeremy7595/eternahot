<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Request received — Eternahot</title>
<meta name="theme-color" content="#0C0B0D">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/eternahot-logo.png">
<style>
  :root{--bg:#0C0B0D;--card:#171519;--line:#2A262E;--ink:#fff;--body:#A7A2AD;--ok:#39D98A;--grad:linear-gradient(135deg,#F03246 0%,#C20E2E 45%,#7C0817 100%)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--body);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:440px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
  img{height:40px;width:auto;margin:0 auto 18px}
  h1{font-family:Fraunces,Georgia,serif;color:var(--ink);font-size:1.55rem;margin-bottom:10px}
  p{font-size:.95rem;line-height:1.55;margin-bottom:12px}
  .ok{color:var(--ok);font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
  a.btn{display:inline-flex;margin-top:10px;min-height:48px;align-items:center;justify-content:center;padding:12px 22px;border-radius:13px;background:var(--grad);color:#fff;font-weight:800;text-decoration:none}
  a.link{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/eternahot-logo.png" alt="Eternahot" width="160" height="62">
    <div class="ok">Request received</div>
    <h1>We'll follow up with a custom quote</h1>
    <p>Thanks — we have your details. If you're a fit for West LA, we'll confirm an open appointment day and price the job from your project details (not a fixed range).</p>
    <p>Questions now? Call <a class="link" href="tel:2132223457">(213) 222-3457</a>.</p>
    <a class="btn" href="/">Back to eternahot.com</a>
  </div>
</body>
</html>
