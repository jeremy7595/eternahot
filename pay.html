<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pay Eternahot Plumbing</title>
<meta name="description" content="Pay Eternahot Plumbing by card, Cash App, Venmo, or Zelle.">
<meta name="theme-color" content="#0C0B0D">
<link rel="canonical" href="https://eternahot.com/pay">
<link rel="icon" href="assets/favicon.png" type="image/png">
<meta property="og:title" content="Pay Eternahot Plumbing">
<meta property="og:description" content="Card, Cash App, Venmo, or Zelle.">
<meta property="og:url" content="https://eternahot.com/pay">
<meta property="og:image" content="https://eternahot.com/assets/og-image.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0B0D; --card:#171519; --line:#2A262E; --ink:#fff; --muted:#A7A2AD; --dim:#6A646F;
  --red:#E11D2E; --grad:linear-gradient(135deg,#F03246,#C20E2E 50%,#7C0817);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--muted);min-height:100dvh}
a{color:inherit;text-decoration:none}
.wrap{max-width:440px;margin:0 auto;padding:16px 14px 48px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px;text-align:center}
.brand img{width:min(100%,340px);height:auto}
.brand .phone{font-weight:800;color:var(--ink);font-size:1.05rem}
h1{font-family:Fraunces,Georgia,serif;color:var(--ink);font-size:1.45rem;line-height:1.15;text-align:center;margin-bottom:12px}
label.amt{display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
input[type=text]{
  width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#121015;
  color:var(--ink);padding:12px 14px;font:inherit;font-size:1.15rem;font-weight:800;margin-bottom:12px;
}
#methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;
  display:flex;flex-direction:column;
}
.handle{font-size:.72rem;color:var(--dim);margin:6px 2px 0;word-break:break-word;text-align:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;width:100%;
  border-radius:12px;font-weight:800;border:0;cursor:pointer;font:inherit;color:#fff;
  font-size:.92rem;
}
.btn img.mark{width:22px;height:22px;flex-shrink:0}
.btn.venmo img.mark{width:auto;height:16px;max-width:78px}
.btn img.cardmark{height:16px;width:auto;flex-shrink:0}
.btn.stripe{background:#fff;color:#0C0B0D}
.btn.bank{background:#0A2540;color:#fff}
.btn.bank svg{width:22px;height:22px;flex-shrink:0;fill:currentColor}
.btn.cash{background:#00D632;color:#000}
.btn.venmo{background:#008CFF;color:#fff}
.btn.venmo img{filter:brightness(0) invert(1)}
.btn.zelle{background:#6D1ED4;color:#fff}
.btn.zelle img{filter:brightness(0) invert(1)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);min-height:36px;font-size:.8rem}
.send{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.send .url{color:var(--ink);font-weight:800;font-size:.92rem;text-align:center;word-break:break-all}
.send .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.note{margin-top:14px;font-size:.8rem;color:var(--dim);text-align:center}
.paid{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;color:var(--ink);font-weight:800;text-align:center}
.paid.show{display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(70px);background:#fff;color:#111;font-weight:800;padding:11px 14px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="/"><img src="assets/eternahot-logo.png" width="1070" height="416" alt="Eternahot — Hot Water Experts"></a>
    <a class="phone" href="tel:2132223457">(213) 222-3457</a>
  </div>
  <h1>Pay Eternahot</h1>
  <p class="paid" id="paid">Paid. Thank you.</p>

  <label class="amt" for="amount">Amount</label>
  <input id="amount" type="text" inputmode="decimal" placeholder="$0.00" autocomplete="off">

  <div id="methods"></div>

  <div class="send">
    <div class="url" id="share-url">eternahot.com/pay</div>
    <div class="row2">
      <button type="button" class="btn ghost" id="copy-link">Copy link</button>
      <a class="btn ghost" id="text-link" href="sms:">Text link</a>
    </div>
  </div>
  <p class="note">After you pay, text <a href="sms:2132223457" style="color:#fff">(213) 222-3457</a>.</p>
</div>
<div class="toast" id="toast"></div>
<script>
const PAY = [
  {
    id: "stripe",
    handle: "Visa · Mastercard · Apple Pay",
    payLabel: "Pay",
    brand: "stripe",
    logos: '<img class="cardmark" src="assets/pay/visa.svg" alt="Visa"><img class="cardmark" src="assets/pay/mastercard.svg" alt="Mastercard"><img class="cardmark" src="assets/pay/applepay.svg" alt="Apple Pay">',
    href(amt) { return amt ? "/api/pay?amount=" + encodeURIComponent(amt) + "&method=card" : ""; }
  },
  {
    id: "bank",
    handle: "ACH · 1–3 business days",
    payLabel: "Bank",
    brand: "bank",
    logos: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v2H4zm0 4h16v6H4zm2 2v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2zM3 8l9-5 9 5v2H3z"/></svg>',
    href(amt) { return amt ? "/api/pay?amount=" + encodeURIComponent(amt) + "&method=bank" : ""; }
  },
  {
    id: "cash",
    handle: "$eternahot",
    payLabel: "Cash App",
    brand: "cash",
    logos: '<img class="mark" src="assets/pay/cashapp.svg" alt="">',
    href(amt) { return amt ? "https://cash.app/$eternahot/" + amt : "https://cash.app/$eternahot"; }
  },
  {
    id: "venmo",
    handle: "@eternahot",
    payLabel: "Venmo",
    brand: "venmo",
    logos: '<img class="mark" src="assets/pay/venmo.svg" alt="">',
    href(amt) {
      const q = new URLSearchParams({ txn: "pay", note: "Eternahot" });
      if (amt) q.set("amount", amt);
      return "https://venmo.com/u/eternahot?" + q;
    }
  },
  {
    id: "zelle",
    handle: "(213) 222-3457",
    payLabel: "Zelle",
    brand: "zelle",
    logos: '<img class="mark" src="assets/pay/zelle.svg" alt="">',
    copy: "2132223457"
  }
];

const params = new URLSearchParams(location.search);
if (params.get("amount")) document.getElementById("amount").value = params.get("amount").replace(/^\$/, "");
if (params.get("paid") === "1") document.getElementById("paid").classList.add("show");

function dollars() {
  const n = Number(document.getElementById("amount").value.replace(/[^0-9.]/g, ""));
  return Number.isFinite(n) && n > 0 ? n.toFixed(2) : "";
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 1800);
}

function draw() {
  const amt = dollars();
  const root = document.getElementById("methods");
  root.innerHTML = PAY.map((m) => {
    const href = m.href ? m.href(amt) : "";
    const extra = href ? `href="${href}" target="_blank" rel="noopener"` : "";
    return `<section class="card">
      <a class="btn ${m.brand}" data-pay="${m.id}" ${extra}>${m.logos}<span>${m.payLabel}</span></a>
      <div class="handle">${m.handle}</div>
    </section>`;
  }).join("");

  root.querySelectorAll("[data-pay]").forEach((btn) => {
    const m = PAY.find((x) => x.id === btn.dataset.pay);
    if (m.copy) {
      btn.addEventListener("click", async (e) => {
        e.preventDefault();
        try { await navigator.clipboard.writeText(m.copy); } catch {}
        toast("Copied (213) 222-3457");
      });
      return;
    }
    if (m.id !== "stripe" && m.id !== "bank") return;
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const val = dollars();
      if (!val) { toast("Enter the amount"); return; }
      location.href = m.href(val);
    });
  });
}

function pageLink() {
  const amt = dollars();
  return amt ? "https://eternahot.com/pay?amount=" + amt : "https://eternahot.com/pay";
}
function share() {
  const url = pageLink();
  document.getElementById("share-url").textContent = url.replace("https://", "");
  document.getElementById("text-link").href = "sms:?&body=" + encodeURIComponent("Pay Eternahot: " + url);
}
document.getElementById("copy-link").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(pageLink()); } catch {}
  toast("Copied");
});
document.getElementById("amount").addEventListener("input", () => { draw(); share(); });
draw();
share();
</script>
</body>
</html>
